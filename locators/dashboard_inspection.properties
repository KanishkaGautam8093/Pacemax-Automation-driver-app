# ============================================================
# Dashboard - Assignment Details / Vehicle Inspection locators
# Format:  key = type:value
# Types:   accessibility (accessibility id / content-desc), id (resource-id), xpath, class
#
# All locators below were seen on the live app (2026-10-13, Samsung SM-M526B)
# and the XPaths were re-checked against the saved screen dumps.
# NOT YET CONFIRMED THROUGH AN APPIUM SESSION - confirm on the first approved run
# (Appium can differ from the screen dump, see Chat history).
# ============================================================

# ---------- Dashboard ----------
dashboard.tab=accessibility:Dashboard
dashboard.title=xpath://android.widget.TextView[@text='Dashboard']
dashboard.report.button=accessibility:Report
# Shown instead of a card when no inspection is assigned (seen live earlier on 2026-10-13)
dashboard.no.assignment.message=xpath://android.widget.TextView[@text='No vehicle assigned']

# ---------- Inspection cards (only the visible card exists on screen) ----------
card.scroller=xpath://android.widget.HorizontalScrollView
# The inspection name shown ABOVE the card (e.g. "Default Inspection") - changes per card
card.inspection.name=xpath://android.widget.HorizontalScrollView/preceding-sibling::android.widget.TextView
card.section.label=xpath://android.widget.TextView[@text='Assignment Details']
# The vehicle name on the card = the card text that is not the section label or the button text
card.vehicle.name=xpath://android.widget.HorizontalScrollView//android.widget.TextView[@text!='Assignment Details'][@text!='Inspect Vehicle']
card.inspect.button=accessibility:Inspect Vehicle

# ---------- Inspection form ----------
form.title=xpath://android.widget.TextView[@text='Inspection']
form.back.button=xpath://android.widget.TextView[@text='Inspection']/preceding-sibling::android.view.ViewGroup[@clickable='true']
# Header texts above the questions: vehicle name, driver name, "NN remaining", "NN/NN"
form.header.texts=xpath://android.widget.ScrollView/preceding-sibling::*//android.widget.TextView
# "06 remaining" -> goes down by 1 for each answered question (verified with one Yes answer)
form.remaining.text=xpath://android.widget.TextView[contains(@text,' remaining')]
form.scroll.container=xpath://android.widget.ScrollView
form.submit.button=accessibility:Submit

# ---------- Questions (the form is FLAT: labels and controls are siblings) ----------
# A control belongs to the nearest question label ABOVE it (decided in Java by position).
# Question labels = TextViews directly inside the container that holds the Submit button.
form.question.labels=xpath://android.view.ViewGroup[android.view.ViewGroup[@content-desc='Submit']]/android.widget.TextView
form.yes.buttons=accessibility:Yes
form.no.buttons=accessibility:No
form.photo.buttons=accessibility:Upload Photo
# Dropdown box = clickable group with a chevron image
form.dropdown.boxes=xpath://android.view.ViewGroup[android.view.ViewGroup[@content-desc='Submit']]/android.view.ViewGroup[@clickable='true'][android.widget.ImageView]
form.dropdown.box.texts=class:android.widget.TextView
# Free text boxes (e.g. "Additional Comments" - its placeholder is its label)
form.text.inputs=xpath://android.view.ViewGroup[android.view.ViewGroup[@content-desc='Submit']]//android.widget.EditText

# ---------- Messages after Submit (the result screen has NOT been seen yet) ----------
# Every visible text on screen - used to look for the result message and the status
screen.texts=class:android.widget.TextView
# PENDING (not seen live): Android toast messages, if the app uses them
toast.message=xpath://android.widget.Toast

# ---------- Dropdown overlay list (same component as Accident "Select Van") ----------
dropdown.list=xpath://android.widget.ScrollView[@content-desc='undefined flatlist']
dropdown.option.texts=xpath://android.widget.ScrollView[@content-desc='undefined flatlist']//android.widget.TextView
