# ============================================================
# Dashboard - Accident Reporting locators (STEP 1 "General Information" only)
# Format:  key = type:value
# Types:   accessibility (accessibility id / content-desc), id (resource-id), xpath, class
#
# All locators below were seen on the live app (2026-10-13, Samsung SM-M526B)
# and the XPaths were re-checked against the saved screen dumps.
# NOT YET CONFIRMED THROUGH AN APPIUM SESSION - confirm on the first approved run.
#
# Steps 2-4 (Your Vehicle Damage, Other Party Information, Additional Information)
# have NOT been inspected, so they have no locators here.
# ============================================================

# ---------- Navigation ----------
dashboard.tab=accessibility:Dashboard
dashboard.report.button=accessibility:Report
accident.title=xpath://android.widget.TextView[@text='Accident Reporting']
accident.back.button=xpath://android.widget.TextView[@text='Accident Reporting']/preceding-sibling::android.view.ViewGroup[@clickable='true']

# ---------- Step indicator (4 steps, seen live) ----------
accident.step1.label=xpath://android.widget.TextView[@text='General Information']
accident.step2.label=xpath://android.widget.TextView[@text='Your Vehicle Damage']
accident.step3.label=xpath://android.widget.TextView[@text='Other Party Information']
accident.step4.label=xpath://android.widget.TextView[@text='Additional Information']

# ---------- Step 1 fields ----------
accident.driver.name.label=xpath://android.widget.TextView[@text='Driver Name']
# The only disabled text box on step 1 = Driver Name (enabled=false, seen live)
accident.driver.name.field=xpath://android.widget.EditText[@enabled='false']
accident.van.label=xpath://android.widget.TextView[@text='Van Name*']
# Shows "Select Van" until a van is chosen
accident.van.dropdown=accessibility:Select Van
# Shows "mm/dd/yyyy" until a date is chosen
accident.date.field=accessibility:mm/dd/yyyy
# Shows "-- : -- AM/PM" until a time is chosen (starts-with so AM or PM both match)
accident.time.field=xpath://android.view.ViewGroup[@clickable='true'][starts-with(@content-desc,'-- :')]

# ---------- Dropdown overlay list (same component as the inspection Gas dropdown) ----------
dropdown.list=xpath://android.widget.ScrollView[@content-desc='undefined flatlist']
dropdown.option.texts=xpath://android.widget.ScrollView[@content-desc='undefined flatlist']//android.widget.TextView

# ---------- Date picker (the app's own calendar) ----------
calendar.month.title=xpath://*[@resource-id='undefined.header.title']
calendar.previous.month=xpath://*[@resource-id='undefined.header.leftArrow']
calendar.next.month=xpath://*[@resource-id='undefined.header.rightArrow']
# {date} is replaced in Java with a VALIDATED yyyy-MM-dd date (digits and dashes only)
calendar.day=xpath://*[@resource-id='undefined.day_{date}']
calendar.cancel.button=xpath://android.view.ViewGroup[@content-desc='OK']/preceding-sibling::android.widget.TextView[@text='Cancel']
# Used live 2026-10-13 to confirm 2026-10-13 (the field then showed 10/13/2026)
calendar.ok.button=accessibility:OK

# ---------- Whole 4-step flow (inspected live 2026-10-13 with Next; Submit NOT pressed) ----------
# Text that appears ONLY on that step (all 4 step names are always shown, so they cannot tell steps apart)
accident.step1.marker=xpath://android.widget.TextView[@text='Van Name*']
accident.step2.marker=xpath://android.widget.TextView[@text='Upload pictures of damage of your vehicle']
accident.step3.marker=xpath://android.widget.TextView[@text='Other Driver Contact Details']
accident.step4.marker=xpath://android.widget.TextView[@text='Did you call 911?']
# Bottom buttons (step 1: Cancel/Next, steps 2-3: Back/Next, step 4: Back/Submit)
accident.next.button=accessibility:Next
accident.submit.button=accessibility:Submit
# Each step's fields are inside one ScrollView (the form is FLAT: labels and controls are siblings)
accident.form.scroll=xpath://android.widget.ScrollView
# Field labels and section headings (texts that are NOT inside a tappable control)
accident.form.labels=xpath://android.widget.ScrollView//android.widget.TextView[not(ancestor::*[@clickable='true'])]
# Text boxes (their placeholder is their text while empty, e.g. 'East', 'Driver Name')
accident.form.inputs=xpath://android.widget.ScrollView//android.widget.EditText
# Tappable choices with a label: Yes/No, radio buttons, option buttons, dropdown boxes, date/time fields
accident.form.choices=xpath://android.widget.ScrollView//*[@clickable='true'][@content-desc!=''][not(self::android.widget.EditText)]
accident.datetime.label=xpath://android.widget.TextView[@text='Accident Date and Time*']

# ---------- Time picker (Android's built-in 12-hour dialog) ----------
time.picker=id:android:id/timePicker
time.mode.toggle=id:android:id/toggle_mode
time.input.hour=id:android:id/input_hour
time.input.minute=id:android:id/input_minute
time.ampm.spinner=id:android:id/am_pm_spinner
time.cancel.button=id:android:id/button2
time.ok.button=id:android:id/button1
# AM/PM buttons in CLOCK mode (seen live) and the AM/PM text shown in TEXT mode
time.clock.am=id:android:id/am_label
time.clock.pm=id:android:id/pm_label
time.ampm.text=xpath://*[@resource-id='android:id/am_pm_spinner']//*[@resource-id='android:id/text1']

# ---------- After Submit ----------
# Green banner seen at the top of the Dashboard right after the 2026-10-13 18:55 submission
# (seen in the failure screenshot; element type not captured yet, so any element with this text)
accident.success.message=xpath://*[@text='Accident Report submitted']

# ---------- Messages whose location is NOT known yet ----------
screen.texts=class:android.widget.TextView
# PENDING (not seen live): Android toast messages, if the app uses them
toast.message=xpath://android.widget.Toast
