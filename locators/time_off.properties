# ============================================================
# Shifts - Time Off locators
# Format:  key = type:value
# Types:   accessibility (accessibility id / content-desc), id (resource-id), xpath, class
#
# Seen on the live app (2026-10-13, Samsung SM-M526B) and the XPaths re-checked
# against the saved screen dumps.
# NOT YET CONFIRMED THROUGH AN APPIUM SESSION - confirm on the first approved run.
# ============================================================

# ---------- Navigation ----------
shifts.tab=accessibility:Shifts
shifts.page.title=xpath://android.widget.TextView[@text='My Schedule']
shifts.timeoff.tab=accessibility:TimeOffScreen

# ---------- Time Off list ----------
# e.g. "You have 1 time off applied"
timeoff.summary=xpath://android.widget.TextView[contains(@text,'time off applied')]
timeoff.list.container=xpath://androidx.recyclerview.widget.RecyclerView
# One tappable row per record, e.g. "09 Oct 2026 - 16 Oct 2026, Duration: 8 days, Pending, Applied on: Fri, 09 October 2026"
timeoff.records=xpath://android.view.ViewGroup[@clickable='true'][contains(@content-desc,'Applied on:')]
# The texts inside one record (searched from the record)
timeoff.record.texts=class:android.widget.TextView
# Calendar icon = first of the two round icons after the summary (the second is a filter)
timeoff.calendar.icon=xpath://android.widget.TextView[contains(@text,'time off applied')]/following-sibling::android.view.ViewGroup[@clickable='true'][following-sibling::android.view.ViewGroup[@clickable='true']]
timeoff.request.button=accessibility:Request Time Off

# ---------- Request Time Off form ----------
# The form's title = the 'Request Time Off' text that has the back arrow BEFORE it.
# (The Time Off LIST also has this text inside its button, which has no back arrow - must not match.)
request.title=xpath://android.widget.TextView[@text='Request Time Off'][preceding-sibling::android.view.ViewGroup[@clickable='true']]
request.back.button=xpath://android.widget.TextView[@text='Request Time Off']/preceding-sibling::android.view.ViewGroup[@clickable='true']
# Duration option labels ("Full Day", "Multiple Days") and their radio circles.
# Java matches each radio to the label right next to it (selected state is colour-only).
request.duration.labels=xpath://android.widget.TextView[@text='Date']/preceding-sibling::android.widget.TextView[@text!='Duration']
request.duration.radios=xpath://android.widget.TextView[@text='Date']/preceding-sibling::android.view.ViewGroup[@clickable='true']
# Clickables between "Date" and "Request Type": the date field (top-most) and "Specify Hours"
# The date field's label is the date itself (pre-filled with tomorrow, e.g. "Wed, 14 Oct 2026")
request.date.area=xpath://android.widget.TextView[@text='Date']/following-sibling::android.view.ViewGroup[@clickable='true'][following-sibling::android.widget.TextView[@text='Request Type']]
request.date.texts=class:android.widget.TextView
# Request Type chips ("PTO", "Others") - the accessibility id is the chip text
request.type.options=xpath://android.widget.TextView[@text='Request Type']/following-sibling::android.view.ViewGroup[@clickable='true'][following-sibling::android.widget.TextView[@text='Reason']]
request.reason.field=xpath://android.widget.TextView[@text='Reason']/following-sibling::android.widget.EditText
# Disabled while the form is incomplete (enabled=false seen live)
request.apply.button=accessibility:Apply

# ---------- Specify Hours (only shown for 'Full Day'; seen live 2026-10-14) ----------
request.specify.hours=accessibility:Specify Hours
# Hides the Start/End Time section again
request.hours.close=accessibility:Close
# The Start Time (left) and End Time (right) fields - show 'HH:MM' until a time is chosen
request.hours.fields=xpath://android.widget.TextView[@text='Start Time']/following-sibling::android.view.ViewGroup[@clickable='true'][following-sibling::android.widget.TextView[@text='Request Type']]

# ---------- Time picker (Android's built-in 12-hour dialog, seen live) ----------
time.picker=id:android:id/timePicker
time.mode.toggle=id:android:id/toggle_mode
time.input.hour=id:android:id/input_hour
time.input.minute=id:android:id/input_minute
time.clock.am=id:android:id/am_label
time.clock.pm=id:android:id/pm_label
time.ampm.text=xpath://*[@resource-id='android:id/am_pm_spinner']//*[@resource-id='android:id/text1']
time.ok.button=id:android:id/button1

# ---------- Date picker (the app's own calendar, with Cancel and OK) ----------
calendar.month.title=xpath://*[@resource-id='undefined.header.title']
calendar.previous.month=xpath://*[@resource-id='undefined.header.leftArrow']
calendar.next.month=xpath://*[@resource-id='undefined.header.rightArrow']
# {date} is replaced in Java with a VALIDATED yyyy-MM-dd date (digits and dashes only)
calendar.day=xpath://*[@resource-id='undefined.day_{date}']
calendar.ok.button=accessibility:OK
calendar.cancel.button=xpath://android.view.ViewGroup[@content-desc='OK']/preceding-sibling::android.widget.TextView[@text='Cancel']
calendar.background=xpath://*[@resource-id='close-modal-container']
calendar.box=xpath://*[@resource-id='white-box-container']
# All texts inside the calendar box (used to read any validation message that appears)
calendar.box.texts=xpath://*[@resource-id='white-box-container']//android.widget.TextView

# ---------- Messages whose location is NOT known yet ----------
# Every visible text on the screen - used to look for validation / success messages
screen.texts=class:android.widget.TextView
# PENDING (not seen live): Android toast messages, if the app uses them
toast.message=xpath://android.widget.Toast
