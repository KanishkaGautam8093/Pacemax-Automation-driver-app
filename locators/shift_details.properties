# ============================================================
# Shifts - Shift Details locators
# Format:  key = type:value
# Types:   accessibility (accessibility id / content-desc), id (resource-id), xpath, class
#
# Seen on the live app (2026-10-13, Samsung SM-M526B) and the XPaths re-checked
# against the saved screen dumps.
# NOT YET CONFIRMED THROUGH AN APPIUM SESSION - confirm on the first approved run.
# ============================================================

# ---------- Navigation ----------
shifts.tab=accessibility:Shifts
shifts.page.title=xpath://android.widget.TextView[@text='My Schedule']
shifts.details.tab=accessibility:ShiftRequestScreen
shifts.timeoff.tab=accessibility:TimeOffScreen

# ---------- Shift list ----------
# The list scrolls inside this container
shift.list.container=xpath://androidx.recyclerview.widget.RecyclerView
# One tappable row per shift, e.g. "9:00 AM - 11:00 PM (+1D), Solo 2, (38 hrs), Auto Accepted"
shift.rows=xpath://androidx.recyclerview.widget.RecyclerView//android.view.ViewGroup[@clickable='true'][android.widget.TextView]
# Date headings above the rows, e.g. "Mon, 05 October 2026"
shift.date.headings=xpath://androidx.recyclerview.widget.RecyclerView//android.widget.TextView[contains(@text,', ')][not(parent::android.view.ViewGroup[@clickable='true'])]
# Shown when there is no shift in the chosen range (seen live)
shift.empty.message=xpath://android.widget.TextView[@text='No data available']
# Calendar icon = first of the two unlabelled round icons above the list (the second is a filter)
shift.calendar.icon=xpath://android.view.ViewGroup[@clickable='true'][following-sibling::android.view.ViewGroup[@clickable='true']][preceding-sibling::android.view.ViewGroup[@clickable='false']]

# ---------- Shift detail page ----------
# Each value is the next text after its label (seen live)
detail.start.time=xpath://android.widget.TextView[@text='Start Time']/following-sibling::android.widget.TextView[1]
detail.finish.time=xpath://android.widget.TextView[@text='Finish Time']/following-sibling::android.widget.TextView[1]
detail.total.time=xpath://android.widget.TextView[@text='Total Time']/following-sibling::android.widget.TextView[1]
detail.station.address=xpath://android.widget.TextView[@text='Station Address']/following-sibling::android.widget.TextView[1]
detail.start.label=xpath://android.widget.TextView[@text='Start Time']
detail.finish.label=xpath://android.widget.TextView[@text='Finish Time']
detail.total.label=xpath://android.widget.TextView[@text='Total Time']
detail.address.label=xpath://android.widget.TextView[@text='Station Address']
# Back arrow = the clickable group in the header, followed by the date title
detail.back.button=xpath://android.view.ViewGroup[@clickable='true'][following-sibling::android.widget.TextView]

# ---------- Calendar (the app's own calendar - selects a RANGE, minimum 2 days) ----------
calendar.month.title=xpath://*[@resource-id='undefined.header.title']
calendar.previous.month=xpath://*[@resource-id='undefined.header.leftArrow']
calendar.next.month=xpath://*[@resource-id='undefined.header.rightArrow']
# {date} is replaced in Java with a VALIDATED yyyy-MM-dd date (digits and dashes only)
calendar.day=xpath://*[@resource-id='undefined.day_{date}']
calendar.ok.button=accessibility:OK
# The dimmed background - tapping it closes the calendar without applying (seen live)
calendar.background=xpath://*[@resource-id='close-modal-container']
calendar.box=xpath://*[@resource-id='white-box-container']
# Shown after OK with only one date picked (seen live)
calendar.range.error=xpath://android.widget.TextView[@text='Minimum 2 days selection is required.']
