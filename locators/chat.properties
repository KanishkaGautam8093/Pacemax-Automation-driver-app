# ============================================================
# Chat tab locators
# Format:  key = type:value
# Types:   accessibility (accessibility id / content-desc)
#          id            (resource-id)
#          xpath
#          class         (class name, used to search INSIDE an element, e.g. texts inside a row)
#
# No chat names, messages or categories are ever inserted into these locators.
# Java finds the elements with these fixed locators and compares the text itself,
# so names/messages with apostrophes or other special characters are safe.
#
# This app exposes NO resource-ids, and its icons are unlabelled SVG images,
# so XPath based on the screen structure is used where nothing better exists.
#
# PENDING = not verified on the live app yet. Tests that need a PENDING
#           locator are SKIPPED (not passed) until the real locator is filled in.
# ============================================================

# ---------- Bottom navigation ----------
# VERIFIED (live)
chat.tab=accessibility:Chat

# ---------- Chat list page ----------
# VERIFIED (live)
chat.page.title=xpath://android.widget.TextView[@text='In-app Chat']
# VERIFIED (live + screenshot): magnifier icon, 2nd icon from the right
chat.search.icon=xpath://android.widget.TextView[@text='In-app Chat']/following-sibling::com.horcrux.svg.SvgView[1]
# VERIFIED (live): right-most icon, also present while search is open
chat.filter.icon=xpath://android.widget.TextView[@text='In-app Chat']/following-sibling::com.horcrux.svg.SvgView[last()]
# VERIFIED (live): placeholder "Search...", replaces the search icon when open
chat.search.input=xpath://android.widget.TextView[@text='In-app Chat']/following-sibling::android.widget.EditText
# VERIFIED (live): the inner ScrollView that holds the chat sections (there is also an outer one)
chat.list.container=xpath://android.widget.ScrollView[not(.//android.widget.ScrollView)]
# VERIFIED (live): every clickable item in the list (section headers + chat rows).
# Used to detect when scrolling no longer changes the screen (end of list).
chat.list.items=xpath://android.widget.ScrollView[not(.//android.widget.ScrollView)]//android.view.ViewGroup[@clickable='true']

# ---------- Chat rows ----------
# VERIFIED (live): chat rows only (a row has 2+ texts; a section header has 1)
chat.rows=xpath://android.widget.ScrollView[not(.//android.widget.ScrollView)]//android.view.ViewGroup[@clickable='true'][count(android.widget.TextView) >= 2]
# VERIFIED (live): the texts inside one row (initials, name, date, last message - order varies).
# Java ignores texts inside the avatar (initials) and on the right half (date),
# then picks the top-most remaining text as the chat name.
# PENDING: confirm on a group chat that shows an image instead of initials.
chat.row.texts=class:android.widget.TextView
# VERIFIED (live via Appium, 2026-10-13): ViewGroups inside one row (searched from the row).
# The small ones at the left end are the avatar (108x108) and its online dot (32x32).
# Note: a relative XPath like ./android.view.ViewGroup[1] returns the ROW itself in Appium - do not use it.
chat.row.groups=class:android.view.ViewGroup

# ---------- Sections ----------
# VERIFIED (live): header is clickable; collapsing removes the rows from the screen
chat.recent.section.header=accessibility:Recent Chats
# The list is FLAT: Pinned header, pinned rows, Recent header, recent rows (one shared parent).
# Pinned Chats is always ABOVE Recent Chats (verified live).
#   Recent row = has the "Recent Chats" header somewhere above it
#   Pinned row = has the "Pinned Chats" header above it AND NOT the "Recent Chats" header
# Note: position predicates like preceding-sibling::*[1] give WRONG results in Appium - do not use them.
# VERIFIED via Appium (2026-10-13): only-Recent = 0 pinned / 3 recent; admin 2 pinned = 1 pinned / 2 recent
chat.recent.section.rows=xpath://android.view.ViewGroup[@clickable='true'][count(android.widget.TextView) >= 2][ancestor::*[preceding-sibling::android.view.ViewGroup[@content-desc='Recent Chats']]]
# VERIFIED (live, 2026-10-13): appears above Recent Chats only when at least one chat is pinned
chat.pinned.section.header=accessibility:Pinned Chats
# VERIFIED via Appium (2026-10-13): rows in the Pinned section (also used to decide whether a chat is pinned).
# A pinned chat MOVES here - it is no longer listed under Recent Chats.
chat.pinned.section.rows=xpath://android.view.ViewGroup[@clickable='true'][count(android.widget.TextView) >= 2][ancestor::*[preceding-sibling::android.view.ViewGroup[@content-desc='Pinned Chats']][not(preceding-sibling::android.view.ViewGroup[@content-desc='Recent Chats'])]]

# ---------- Pin / Unpin by SWIPE ----------
# VERIFIED (live, 2026-10-13): swipe the row RIGHT-TO-LEFT -> a blue button appears at the row's right end
chat.row.swipe.pin.button=accessibility:Pin
chat.row.swipe.unpin.button=accessibility:Unpin

# ---------- Pin / Unpin by LONG PRESS ----------
# VERIFIED (live, 2026-10-13): long press (1.2 s) -> header changes to "<arrow> 1 Selected  <pin icon>  <menu>"
chat.selection.title=xpath://android.widget.TextView[contains(@text,' Selected')]
# VERIFIED (live, 2026-10-13): 2nd icon from the right. Unlabelled SVG, not marked clickable.
# The SAME icon is Pin for an unpinned chat and Unpin (crossed-out pin) for a pinned chat.
chat.selection.pin.icon=xpath://android.widget.TextView[contains(@text,' Selected')]/following-sibling::com.horcrux.svg.SvgView[1]
# VERIFIED via Appium (2026-10-13): drawing parts of that icon as Appium sees them
#   Pin icon = 1 part, Unpin (crossed-out) icon = 3 parts
#   (the screen dump shows 2 and 4, but Appium hides a zero-width line in both icons)
chat.selection.icon.parts=xpath://android.widget.TextView[contains(@text,' Selected')]/following-sibling::com.horcrux.svg.SvgView[1]//com.horcrux.svg.PathView

# ---------- Conversation screen ----------
# VERIFIED (live + screenshot): back arrow = the header SVG that is followed by the clickable chat-name block
chat.conversation.back.button=xpath://com.horcrux.svg.SvgView[following-sibling::android.view.ViewGroup[@clickable='true'][android.widget.TextView]]
# VERIFIED (live): chat name text in the conversation header
chat.conversation.header.title=xpath://com.horcrux.svg.SvgView[following-sibling::android.view.ViewGroup[@clickable='true'][android.widget.TextView]]/following-sibling::android.view.ViewGroup[@clickable='true'][android.widget.TextView][1]/android.widget.TextView
# VERIFIED (live): placeholder "Type Message"
chat.message.input=xpath://android.widget.EditText
# VERIFIED (live + screenshot): paper-plane icon right of the input.
# PENDING: its bounds are cut off at the screen edge in the hierarchy - confirm the tap works.
chat.send.button=xpath://android.widget.EditText/following-sibling::android.view.ViewGroup[@clickable='true'][1]
# VERIFIED (live): outgoing bubbles = bubbles with a tick icon (incoming bubbles have none).
chat.message.outgoing.bubbles=xpath://android.widget.ScrollView[not(.//android.widget.ScrollView)]//android.view.ViewGroup[@clickable='true'][com.horcrux.svg.SvgView]
# VERIFIED (live): the texts inside one bubble (message text and time)
chat.message.bubble.texts=class:android.widget.TextView

# ---------- Filter panel ----------
# VERIFIED (live)
chat.filter.panel.title=xpath://android.widget.TextView[@text='Filter by:']
# VERIFIED (live): every option label, e.g. "All (3)", "Managers (3)" (top to bottom)
chat.filter.option.labels=xpath://android.view.ViewGroup[@content-desc='Filter by:']/android.widget.TextView[contains(@text,' (')]
# VERIFIED (live): every option checkbox (top to bottom, same order as the labels)
chat.filter.checkboxes=xpath://android.view.ViewGroup[@content-desc='Filter by:']/android.view.ViewGroup[@clickable='true'][not(@content-desc='Apply')]
# VERIFIED (live): a ticked checkbox contains a tick SVG, an unticked one does not
chat.filter.checkbox.tick=class:com.horcrux.svg.SvgView
# VERIFIED (live)
chat.filter.apply.button=accessibility:Apply
chat.filter.close.button=xpath://android.widget.TextView[@text='Close']
