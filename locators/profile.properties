# ============================================================
# Profile tab locators (verified on the live app)
# Format:  key = type:value
# Types:   accessibility (accessibility id / content-desc), id (resource-id), xpath
# ============================================================

# Bottom navigation tab
profile.tab=accessibility:Profile

# Profile page
profile.page.title=xpath://android.widget.TextView[@text='My Profile']
profile.email.value=xpath://android.widget.TextView[@text='E-mail ID']/following-sibling::android.widget.TextView[1]
profile.phone.value=xpath://android.widget.TextView[@text='Phone number']/following-sibling::android.widget.TextView[1]
profile.status.value=xpath://android.widget.TextView[@text='Status']/following-sibling::android.widget.TextView[1]
profile.shared.documents.button=accessibility:Shared Documents
profile.logout.button=accessibility:Log Out

# Shared Documents page
shared.documents.page.title=xpath://android.widget.TextView[@text='Shared Documents']
shared.documents.back.button=xpath://android.widget.TextView[@text='Shared Documents']/preceding-sibling::android.view.ViewGroup[@clickable='true'][1]
shared.documents.empty.message=xpath://android.widget.TextView[@text='No Documents']
# All text inside the document list area (document names, or the empty message)
shared.documents.list.texts=xpath://android.widget.TextView[@text='Shared Documents']/following-sibling::*[last()]//android.widget.TextView
