# ============================================================
# Pacemax Driver App - environment configuration
# Change device or server settings here only.
# ============================================================

# Appium server address (Appium 3 does NOT use /wd/hub)
appium.server.url=http://127.0.0.1:4723

# Device settings
platform.name=Android
automation.name=UiAutomator2
# Serial number shown by "adb devices"
device.udid=RFCR91BV5HY

# App settings
# Discovered from the device with: adb shell dumpsys window
app.package=com.pacemax_driver_rnapp
app.activity=.MainActivity

# true = keep app data and login between sessions (do not clear the app)
no.reset=true

# true = do not fail when the phone blocks Appium's hidden API settings change
# (needed on Xiaomi / MIUI phones: "Permission denial ... WRITE_SECURE_SETTINGS")
ignore.hidden.api.policy.error=true

# false = do not auto-grant permissions to the app under test (only used when Appium installs that app)
auto.grant.permissions=false

# How long (seconds) Appium waits for the next command before closing the session
new.command.timeout=300

# Default explicit wait time (seconds) used when waiting for elements
explicit.wait.seconds=15
